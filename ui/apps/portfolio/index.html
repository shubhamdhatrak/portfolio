    <link rel="icon" href="src/assets/favicon.png" />

    <meta name="description" content="Senior Software Engineer with 7+ years building scalable backend systems, from greenfield services, data platforms, workflow orchestration, and production infrastructure." />

    <meta property="og:url" content="https://shubhamdhatrak.github.io/portfolio/" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function () {
        var stored = localStorage.getItem('portfolio-theme');
        var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#0f172a' : '#ffffff');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
